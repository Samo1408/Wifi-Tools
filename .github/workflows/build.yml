name: Build Android App & Zygisk Module

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup NDK 27 (avoids overload ambiguity in NDK 29+)
      run: |
        NDK_ZIP="android-ndk-r27-linux.zip"
        NDK_DIR="/tmp/android-ndk-r27"
        if [ ! -d "$NDK_DIR" ]; then
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q "${NDK_ZIP}" -d /tmp/
          rm "${NDK_ZIP}"
        fi
        echo "ANDROID_NDK_HOME=${NDK_DIR}" >> $GITHUB_ENV
        echo "NDK version:"
        ${NDK_DIR}/ndk-build --version

    - name: Download and Setup Dobby Hooking Library
      run: |
        mkdir -p dobby_dl
        curl -fL https://github.com/jmpews/Dobby/releases/download/latest/dobby-android-all.zip -o dobby_dl/all.zip 2>/dev/null || true
        for f in dobby_dl/*.zip; do
          [ -f "$f" ] && unzip -q "$f" -d dobby_dl/ 2>/dev/null || true
        done

        mkdir -p zygisk_module/zygisk/jni/include
        mkdir -p zygisk_module/zygisk/jni/lib/arm64-v8a
        mkdir -p zygisk_module/zygisk/jni/lib/armeabi-v7a
        mkdir -p zygisk_module/zygisk/jni/lib/x86
        mkdir -p zygisk_module/zygisk/jni/lib/x86_64

        DOBBY_H=$(find dobby_dl -name "dobby.h" 2>/dev/null | head -n 1)
        if [ -n "$DOBBY_H" ]; then
          cp "$DOBBY_H" zygisk_module/zygisk/jni/include/
        else
          printf '#pragma once\nvoid *DobbyHook(void *addr, void *replace, void **origin_call);\n' > zygisk_module/zygisk/jni/include/dobby.h
        fi

        for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
          LIB=$(find dobby_dl -path "*/${ABI}/libdobby.a" 2>/dev/null | head -n 1)
          if [ -n "$LIB" ]; then
            cp "$LIB" zygisk_module/zygisk/jni/lib/${ABI}/
          else
            touch /tmp/empty.c
            ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar rcs \
              zygisk_module/zygisk/jni/lib/${ABI}/libdobby.a /tmp/empty.c 2>/dev/null || \
            ar rcs zygisk_module/zygisk/jni/lib/${ABI}/libdobby.a
          fi
        done

    - name: Build Zygisk native binary with ndk-build
      run: |
        cd zygisk_module/zygisk/jni
        ${ANDROID_NDK_HOME}/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=Android.mk \
          NDK_APPLICATION_MK=Application.mk

    - name: Package Zygisk Magisk Module
      run: |
        mkdir -p zygisk_module/zygisk/arm64-v8a
        mkdir -p zygisk_module/zygisk/armeabi-v7a
        mkdir -p zygisk_module/zygisk/x86
        mkdir -p zygisk_module/zygisk/x86_64

        for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
          SRC="zygisk_module/zygisk/libs/${ABI}/libwifi_bssid_changer_zygisk.so"
          DST="zygisk_module/zygisk/${ABI}/"
          [ -f "$SRC" ] && cp "$SRC" "$DST" || echo "Warning: $SRC not found"
        done

        rm -rf zygisk_module/zygisk/jni zygisk_module/zygisk/obj zygisk_module/zygisk/libs

        cd zygisk_module
        zip -r ../wifi_bssid_changer_zygisk.zip module.prop post-fs-data.sh service.sh zygisk/
        zipinfo ../wifi_bssid_changer_zygisk.zip
        cd ..

    - name: Build Android App (Release APK)
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Wifi-Address-Changer-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    - name: Upload Zygisk Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Wifi-Bssid-Changer-Zygisk-Module
        path: wifi_bssid_changer_zygisk.zip
