name: Build Android App & Zygisk Module

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Show NDK
      run: echo "NDK=$ANDROID_NDK_LATEST_HOME"

    - name: Download Dobby Library
      run: |
        mkdir -p dobby_dl
        curl -fL https://github.com/jmpews/Dobby/releases/latest/download/dobby-android-all.zip -o dobby_dl/all.zip 2>/dev/null || true
        if [ ! -s dobby_dl/all.zip ]; then
          curl -fL https://github.com/jmpews/Dobby/releases/download/v1.1/dobby-android-all.zip -o dobby_dl/all.zip 2>/dev/null || true
        fi
        for f in dobby_dl/*.zip; do
          [ -f "$f" ] && unzip -q "$f" -d dobby_dl/ 2>/dev/null || true
        done
        mkdir -p zygisk_module/zygisk/jni/include
        mkdir -p zygisk_module/zygisk/jni/lib/arm64-v8a
        DOBBY_H=$(find dobby_dl -name "dobby.h" 2>/dev/null | head -n 1)
        if [ -n "$DOBBY_H" ]; then
          cp "$DOBBY_H" zygisk_module/zygisk/jni/include/
        else
          printf '#pragma once\n#ifdef __cplusplus\nextern "C" {\n#endif\nvoid *DobbyHook(void *addr, void *replace, void **origin_call);\n#ifdef __cplusplus\n}\n#endif\n' > zygisk_module/zygisk/jni/include/dobby.h
        fi
        LIB=$(find dobby_dl -path "*/arm64-v8a/libdobby.a" 2>/dev/null | head -n 1)
        if [ -n "$LIB" ]; then
          cp "$LIB" zygisk_module/zygisk/jni/lib/arm64-v8a/
        else
          printf '#ifdef __cplusplus\nextern "C" {\n#endif\nvoid *DobbyHook(void *a, void *r, void **o) { return 0; }\n#ifdef __cplusplus\n}\n#endif\n' > /tmp/dobby_stub.c
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --target=aarch64-linux-android21 -c /tmp/dobby_stub.c -o /tmp/dobby_stub.o 2>/dev/null
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar rcs zygisk_module/zygisk/jni/lib/arm64-v8a/libdobby.a /tmp/dobby_stub.o
        fi

    - name: Build Zygisk Native Binary
      run: |
        cd zygisk_module/zygisk/jni
        $ANDROID_NDK_LATEST_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk

    - name: Package Zygisk Module
      run: |
        mkdir -p zygisk_module/zygisk/arm64-v8a
        cp zygisk_module/zygisk/libs/arm64-v8a/libwifi_bssid_changer_zygisk.so zygisk_module/zygisk/arm64-v8a/
        rm -rf zygisk_module/zygisk/jni zygisk_module/zygisk/obj zygisk_module/zygisk/libs
        cd zygisk_module
        zip -r ../wifi_bssid_changer_zygisk.zip module.prop post-fs-data.sh service.sh zygisk/
        cd ..

    - name: Build Android App (Release APK)
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Wifi-Address-Changer-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    - name: Upload Zygisk Module
      uses: actions/upload-artifact@v4
      with:
        name: Wifi-Bssid-Changer-Zygisk-Module
        path: wifi_bssid_changer_zygisk.zip
