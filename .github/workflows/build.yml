name: Build Android App & Zygisk Module

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Show pre-installed NDK
      run: |
        echo "NDK=$ANDROID_NDK_LATEST_HOME"
        ls $ANDROID_NDK_LATEST_HOME

    - name: Download and Setup Dobby Hooking Library
      run: |
        mkdir -p dobby_dl
        # Primary: try tagged release asset
        curl -fL https://github.com/jmpews/Dobby/releases/latest/download/dobby-android-all.zip -o dobby_dl/all.zip 2>/dev/null || true
        # Fallback: try specific release v1.1
        if [ ! -f dobby_dl/all.zip ] || [ ! -s dobby_dl/all.zip ]; then
          curl -fL https://github.com/jmpews/Dobby/releases/download/v1.1/dobby-android-all.zip -o dobby_dl/all.zip 2>/dev/null || true
        fi
        for f in dobby_dl/*.zip; do
          [ -f "$f" ] && unzip -q "$f" -d dobby_dl/ 2>/dev/null || true
        done

        mkdir -p zygisk_module/zygisk/jni/include
        mkdir -p zygisk_module/zygisk/jni/lib/arm64-v8a
        mkdir -p zygisk_module/zygisk/jni/lib/armeabi-v7a
        mkdir -p zygisk_module/zygisk/jni/lib/x86
        mkdir -p zygisk_module/zygisk/jni/lib/x86_64

        DOBBY_H=$(find dobby_dl -name "dobby.h" 2>/dev/null | head -n 1)
        if [ -n "$DOBBY_H" ]; then
          cp "$DOBBY_H" zygisk_module/zygisk/jni/include/
        else
          printf '#pragma once\nvoid *DobbyHook(void *addr, void *replace, void **origin_call);\n' > zygisk_module/zygisk/jni/include/dobby.h
        fi

        for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
          LIB=$(find dobby_dl -path "*/${ABI}/libdobby.a" 2>/dev/null | head -n 1)
          if [ -n "$LIB" ]; then
            cp "$LIB" zygisk_module/zygisk/jni/lib/${ABI}/
          else
            # Create a valid stub .o and archive it
            cat > /tmp/dobby_stub.c << 'EOF'
void *DobbyHook(void *addr, void *replace, void **origin_call) { return 0; }
EOF
            ${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
              --target=aarch64-linux-android21 \
              -c /tmp/dobby_stub.c -o /tmp/dobby_stub.o 2>/dev/null || true
            if [ -f /tmp/dobby_stub.o ]; then
              ${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar rcs \
                zygisk_module/zygisk/jni/lib/${ABI}/libdobby.a /tmp/dobby_stub.o 2>/dev/null
            fi
            # Ultimate fallback: just ar with a valid empty C file compiled by gcc
            if [ ! -f zygisk_module/zygisk/jni/lib/${ABI}/libdobby.a ]; then
              echo "int dummy;" > /tmp/dummy.c
              gcc -c /tmp/dummy.c -o /tmp/dummy.o 2>/dev/null
              ar rcs zygisk_module/zygisk/jni/lib/${ABI}/libdobby.a /tmp/dummy.o 2>/dev/null || true
            fi
          fi
        done

    - name: Build Zygisk native binary with ndk-build
      run: |
        cd zygisk_module/zygisk/jni
        $ANDROID_NDK_LATEST_HOME/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=Android.mk \
          NDK_APPLICATION_MK=Application.mk

    - name: Package Zygisk Magisk Module
      run: |
        mkdir -p zygisk_module/zygisk/arm64-v8a
        mkdir -p zygisk_module/zygisk/armeabi-v7a
        mkdir -p zygisk_module/zygisk/x86
        mkdir -p zygisk_module/zygisk/x86_64

        for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
          SRC="zygisk_module/zygisk/libs/${ABI}/libwifi_bssid_changer_zygisk.so"
          DST="zygisk_module/zygisk/${ABI}/"
          [ -f "$SRC" ] && cp "$SRC" "$DST" || echo "Warning: $SRC not found"
        done

        rm -rf zygisk_module/zygisk/jni zygisk_module/zygisk/obj zygisk_module/zygisk/libs

        cd zygisk_module
        zip -r ../wifi_bssid_changer_zygisk.zip module.prop post-fs-data.sh service.sh zygisk/
        zipinfo ../wifi_bssid_changer_zygisk.zip
        cd ..

    - name: Build Android App (Release APK)
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Wifi-Address-Changer-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn

    - name: Upload Zygisk Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Wifi-Bssid-Changer-Zygisk-Module
        path: wifi_bssid_changer_zygisk.zip
